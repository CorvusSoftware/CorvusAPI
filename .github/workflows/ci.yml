# SPDX-License-Identifier: MIT

name: CorvusAPI CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  headers:
    name: Public C11 and C++20 headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check copyright and license identifiers
        shell: bash
        run: |
          for header in include/*.h; do
            test "$(sed -n '1p' "$header")" = '// CorvusAPI - CorvusSoftware'
            test "$(sed -n '2p' "$header")" = '// Copyright (C) 2026 CorvusSoftware'
            test "$(sed -n '3p' "$header")" = '// SPDX-License-Identifier: MIT'
          done
      - name: Compile public headers independently and in both orders
        run: |
          set -euo pipefail
          for header in corvusapi.h achievements.h; do
            printf '#include <%s>\n' "$header" | cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -x c -fsyntax-only -
            printf '#include <%s>\n' "$header" | c++ -std=c++20 -Wall -Wextra -Werror -pedantic -Iinclude -x c++ -fsyntax-only -
          done
          printf '#include <corvusapi.h>\n#include <achievements.h>\n' | cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -x c -fsyntax-only -
          printf '#include <achievements.h>\n#include <corvusapi.h>\n' | c++ -std=c++20 -Wall -Wextra -Werror -pedantic -Iinclude -x c++ -fsyntax-only -
          printf '#include <corvusapi.h>\n' | clang -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -x c -fsyntax-only -

  integration:
    name: Build, verify and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure verifier, example core and lifecycle tests
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCORVUSAPI_BUILD_VERIFIER=ON
          -DCORVUSAPI_BUILD_EXAMPLES=ON
          -DCORVUSAPI_BUILD_TESTS=ON
      - name: Build C11 example and verifier
        run: cmake --build build --config Release --parallel 2
      - name: Run native ABI and lifecycle tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install public headers and CMake config
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/corvusapi-install"
          test -f "$RUNNER_TEMP/corvusapi-install/include/corvusapi.h"
          test ! -d "$RUNNER_TEMP/corvusapi-install/include/corvus"
          test -f "$RUNNER_TEMP/corvusapi-install/include/achievements.h"
          test ! -d include/corvus
      - name: Test standalone downstream find_package consumer
        run: |
          cmake -S tests/package_consumer -B consumer \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/corvusapi-install"
          cmake --build consumer --config Release --parallel 2
          ctest --test-dir consumer -C Release --output-on-failure
